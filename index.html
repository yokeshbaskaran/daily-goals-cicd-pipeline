<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Daily Goals</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="icon.png" />
</head>

<body>
    <div class="page-wrapper">
        <header class="site-header">
            <h1 class="title">Daily Goals</h1>
            <p class="subtitle">
                Track what you want to accomplish today.
            </p>
        </header>

        <main class="app">
            <section class="counter">
                <span class="counter-label">Total Goals:</span>
                <span id="goal-count" class="counter-value">0</span>
            </section>

            <form id="goal-form" class="goal-form">
                <input id="goal-input" class="goal-input" placeholder="Enter a goal" maxlength="100" required />
                <button type="submit" class="btn primary">Add</button>
            </form>

            <ul id="goals-list" class="goals-list"></ul>

            <button id="clear-all" class="btn secondary">Clear All</button>
        </main>

        <footer class="footer">
            <p class="footer-text">
                Made with 💖 by <strong class="footer-author">Yokesh B</strong>
            </p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>

</html>
